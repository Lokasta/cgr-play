<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101214" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <title>Dirt Lab — Cozy Gun Restoration</title>
    <style>
      :root {
        color-scheme: dark;
        --lab-bg: #14161a;
        --lab-panel: rgba(20, 22, 26, 0.94);
        --lab-line: rgba(255, 255, 255, 0.08);
        --lab-line-hot: rgba(255, 255, 255, 0.22);
        --lab-ink: #d9dde3;
        --lab-ink-dim: #8b929c;
        --lab-ink-hi: #ffffff;
        --lab-accent: #e0b667;
        --lab-accent-dim: rgba(224, 182, 103, 0.18);
        --lab-grease: #b58a4d;
        --lab-grime: #c9563a;
        --lab-oil: #6f9bd6;
        --lab-mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--lab-bg);
        color: var(--lab-ink);
        font: 12.5px/1.35 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      #lab {
        display: block;
        position: fixed;
        left: 0;
        top: 0;
        touch-action: none;
      }

      /* ---- brush ring (follows the pointer while a tool is in hand) ---- */
      .lab-ring {
        position: fixed;
        left: 0;
        top: 0;
        border-radius: 50%;
        border: 1.5px solid rgba(255, 255, 255, 0.55);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45);
        pointer-events: none;
        z-index: 20;
        transition: border-color 0.12s ease;
      }
      .lab-ring.over { border-color: var(--lab-accent); }
      .lab-ring[data-mode='dirty'] { border-style: dashed; border-color: var(--lab-grime); }
      .lab-ring[data-tool='oil'].over { border-color: var(--lab-oil); }

      /* ---- gear ---- */
      .lab-gear {
        position: fixed;
        right: 14px;
        top: 14px;
        z-index: 31;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1px solid var(--lab-line);
        background: var(--lab-panel);
        color: var(--lab-ink-dim);
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lab-gear:hover,
      .lab-gear.active { color: var(--lab-accent); border-color: var(--lab-line-hot); }
      .lab-gear[hidden] { display: none; }

      /* ---- panel ---- */
      .lab-panel {
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        width: 352px;
        max-width: 100vw;
        z-index: 30;
        display: none;
        flex-direction: column;
        background: var(--lab-panel);
        border-left: 1px solid var(--lab-line);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
      }
      .lab-panel.open { display: flex; }
      .lab-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--lab-line);
      }
      .lab-head strong { font-size: 14px; color: var(--lab-ink-hi); letter-spacing: 0.02em; }
      .lab-badge {
        font: 10px/1 var(--lab-mono);
        padding: 3px 6px;
        border-radius: 5px;
        background: var(--lab-accent-dim);
        color: var(--lab-accent);
        text-transform: uppercase;
      }
      .lab-flex { flex: 1; }
      .lab-iconbtn {
        border: 1px solid var(--lab-line);
        background: transparent;
        color: var(--lab-ink-dim);
        border-radius: 7px;
        padding: 4px 8px;
        cursor: pointer;
        font-size: 12px;
      }
      .lab-iconbtn:hover { color: var(--lab-ink-hi); border-color: var(--lab-line-hot); }
      .lab-body {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 6px 10px 12px;
        scrollbar-width: thin;
      }
      .lab-foot {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 10px 12px;
        border-top: 1px solid var(--lab-line);
      }
      .lab-toast {
        flex: 1;
        text-align: right;
        font: 11px var(--lab-mono);
        color: var(--lab-accent);
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .lab-toast.show { opacity: 1; }

      /* ---- mode strip ---- */
      .lab-modes { display: flex; gap: 4px; padding: 8px 4px 4px; }
      .lab-mode {
        flex: 1;
        border: 1px solid var(--lab-line);
        background: rgba(255, 255, 255, 0.03);
        color: var(--lab-ink-dim);
        border-radius: 7px;
        padding: 6px 0;
        cursor: pointer;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .lab-mode.on { background: var(--lab-accent-dim); border-color: rgba(224, 182, 103, 0.6); color: var(--lab-ink-hi); }

      /* ---- outliner tree ---- */
      .lab-tree { display: flex; flex-direction: column; gap: 1px; }
      .lab-treehead { font-size: 11px; font-weight: 600; color: var(--lab-ink-dim); padding: 6px 2px 3px; }
      .lab-treerow {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 1px 2px 1px 10px;
        border-radius: 5px;
      }
      .lab-treerow.sel { background: rgba(255, 225, 74, 0.12); }
      .lab-treerow.off .lab-treename { opacity: 0.45; text-decoration: line-through; }
      .lab-treename {
        flex: 1;
        text-align: left;
        border: none;
        background: transparent;
        color: var(--lab-ink);
        font-size: 11.5px;
        padding: 3px 4px;
        cursor: pointer;
        border-radius: 4px;
      }
      .lab-treename:hover { background: rgba(255, 255, 255, 0.05); color: var(--lab-ink-hi); }
      .lab-treecount { font: 10px var(--lab-mono); color: var(--lab-ink-dim); }
      .lab-treerow.anchor .lab-dot { width: 8px; height: 8px; }
      .lab-dot.kind-front { background: #ff3b3b; }
      .lab-dot.kind-breech { background: #ff9a3b; }
      .lab-dot.kind-gap { background: #ffe14a; }
      .lab-dot.kind-muzzle { background: #4ad8ff; }

      /* ---- sections ---- */
      .lab-sec { border-bottom: 1px solid var(--lab-line); }
      .lab-sec h4 {
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--lab-ink-dim);
        padding: 10px 4px 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .lab-sec h4::before { content: '▾'; font-size: 10px; opacity: 0.6; }
      .lab-sec.closed h4::before { content: '▸'; }
      .lab-sec.closed .lab-secbody { display: none; }
      .lab-secbody { padding: 0 2px 10px; display: flex; flex-direction: column; gap: 6px; }
      .lab-hint { font-size: 11px; color: var(--lab-ink-dim); line-height: 1.4; padding: 0 2px 2px; }
      .lab-sub { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
      .lab-sub h5 {
        font-size: 11px;
        font-weight: 600;
        color: var(--lab-ink-dim);
        padding: 4px 2px 2px;
      }

      /* ---- rows (registry knobs) ---- */
      .lab-row {
        display: grid;
        grid-template-columns: 108px 1fr 58px 18px;
        align-items: center;
        gap: 6px;
        padding: 1px 2px;
        border-radius: 5px;
      }
      .lab-row.dirty { background: rgba(224, 182, 103, 0.07); }
      .lab-row label {
        font-size: 11.5px;
        color: var(--lab-ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .lab-row.dirty label { color: var(--lab-accent); }
      .lab-row input[type='range'] { width: 100%; accent-color: var(--lab-accent); height: 18px; }
      .lab-row input[type='number'] {
        width: 100%;
        font: 11px var(--lab-mono);
        color: var(--lab-ink-hi);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--lab-line);
        border-radius: 4px;
        padding: 2px 4px;
        -moz-appearance: textfield;
      }
      .lab-row input[type='number']::-webkit-inner-spin-button { -webkit-appearance: none; }
      .lab-row.color { grid-template-columns: 108px 1fr; }
      .lab-row input[type='color'] {
        width: 100%;
        height: 22px;
        border: 1px solid var(--lab-line);
        border-radius: 5px;
        background: transparent;
        padding: 0 2px;
        cursor: pointer;
      }
      .lab-reset {
        border: none;
        background: transparent;
        color: var(--lab-accent);
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
        padding: 0;
      }

      /* ---- layer cards ---- */
      .lab-card {
        border: 1px solid var(--lab-line);
        border-radius: 9px;
        padding: 8px 8px 6px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: rgba(255, 255, 255, 0.02);
      }
      .lab-card.hidden-layer { opacity: 0.55; }
      .lab-card.hidden-layer .lab-look { display: none; }
      .lab-cardhead { display: flex; align-items: center; gap: 7px; }
      .lab-cardhead b { font-size: 13px; color: var(--lab-ink-hi); }
      .lab-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
      .layer-dust .lab-dot { background: #cfc6b4; }
      .layer-powder .lab-dot { background: #3a3532; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25); }
      .lab-chan {
        font: 10px var(--lab-mono);
        color: var(--lab-ink-dim);
        border: 1px solid var(--lab-line);
        border-radius: 4px;
        padding: 1px 4px;
      }
      .lab-mean { flex: 1; text-align: right; font: 11px var(--lab-mono); color: var(--lab-ink-dim); }
      .lab-mini {
        width: 26px;
        height: 24px;
        border-radius: 6px;
        border: 1px solid var(--lab-line);
        background: transparent;
        color: var(--lab-ink-dim);
        cursor: pointer;
        font-size: 12px;
      }
      .lab-mini.on { color: var(--lab-accent); border-color: rgba(224, 182, 103, 0.5); background: var(--lab-accent-dim); }
      .lab-cardrow { display: flex; align-items: center; gap: 6px; }
      .lab-cardrow label { font-size: 11.5px; min-width: 32px; color: var(--lab-ink-dim); }
      .lab-cardrow input[type='range'] { flex: 1; accent-color: var(--lab-accent); }
      .lab-cardrow input[type='number'] {
        width: 64px;
        font: 11px var(--lab-mono);
        color: var(--lab-ink-hi);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--lab-line);
        border-radius: 4px;
        padding: 3px 5px;
      }
      .lab-cardrow select {
        flex: 1;
        font: 12px system-ui, sans-serif;
        color: var(--lab-ink-hi);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--lab-line);
        border-radius: 5px;
        padding: 4px 6px;
      }
      .lab-amt { font: 10.5px var(--lab-mono); color: var(--lab-ink-dim); width: 34px; text-align: right; }
      .lab-look { display: flex; flex-direction: column; gap: 3px; border-top: 1px dashed var(--lab-line); padding-top: 6px; }

      /* ---- buttons / chips / toggles ---- */
      .lab-btn {
        border: 1px solid var(--lab-line);
        background: rgba(255, 255, 255, 0.04);
        color: var(--lab-ink);
        border-radius: 7px;
        padding: 5px 9px;
        cursor: pointer;
        font-size: 11.5px;
        white-space: nowrap;
      }
      .lab-btn:hover { border-color: var(--lab-line-hot); color: var(--lab-ink-hi); }
      .lab-btn.primary { background: rgba(224, 182, 103, 0.22); border-color: rgba(224, 182, 103, 0.5); color: #f6e7c3; }
      .lab-btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .lab-strip { display: flex; flex-wrap: wrap; gap: 5px; }
      .lab-chip {
        border: 1px solid var(--lab-line);
        background: rgba(255, 255, 255, 0.03);
        color: var(--lab-ink);
        border-radius: 999px;
        padding: 4px 10px 4px 11px;
        cursor: pointer;
        font-size: 11.5px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .lab-chip.on { background: var(--lab-accent-dim); border-color: rgba(224, 182, 103, 0.55); color: var(--lab-ink-hi); }
      kbd {
        font: 9.5px var(--lab-mono);
        color: var(--lab-ink-dim);
        border: 1px solid var(--lab-line);
        border-radius: 3px;
        padding: 0 4px;
        line-height: 14px;
      }
      .lab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
      .lab-toggle { display: flex; align-items: center; gap: 6px; font-size: 11.5px; cursor: pointer; }
      .lab-toggle input { accent-color: var(--lab-accent); }
      .lab-toggle kbd { margin-left: auto; }

      /* ---- live state ---- */
      .lab-state {
        font: 11px/1.5 var(--lab-mono);
        color: var(--lab-ink);
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid var(--lab-line);
        border-radius: 7px;
        padding: 8px 10px;
        white-space: pre;
        overflow-x: auto;
      }

      /* ---- anchor labels (projected each frame) ---- */
      .lab-tags { position: fixed; inset: 0; pointer-events: none; z-index: 12; }
      .lab-tag {
        position: absolute;
        left: 0;
        top: 0;
        transform: translate(-9999px, -9999px);
        margin: -22px 0 0 8px;
        font: 10.5px var(--lab-mono);
        color: var(--lab-ink-hi);
        background: rgba(10, 12, 16, 0.78);
        border: 1px solid var(--tag, #fff);
        border-radius: 4px;
        padding: 1px 5px;
        white-space: nowrap;
        pointer-events: none;
      }
      .lab-tag::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--tag, #fff); margin-right: 5px; vertical-align: 0; }
      .lab-tag.sel { background: var(--tag, #fff); color: #101214; font-weight: 700; }

      /* ---- corner legend ---- */
      .lab-legend {
        position: fixed;
        left: 14px;
        top: 12px;
        z-index: 10;
        font: 11px/1.5 var(--lab-mono);
        color: var(--lab-ink-dim);
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      .lab-legend b { color: var(--lab-ink); font-weight: 600; }
    </style>
    <script type="module" crossorigin src="./assets/lab-BUx5pqtT.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/brushCleaningStation-C6VWyWR8.js">
  </head>
  <body>
    <canvas id="lab"></canvas>
    <div class="lab-ring" hidden></div>
    <div class="lab-tags"></div>
    <div class="lab-legend">
      <b>Dirt Lab</b> · arrastar = orbitar · roda = zoom · dir. = pan<br />
      1 patch · 2 escova · 3 vareta · 0 orbitar · D sujar · M máscara · C cavidades · A âncoras · O orto · G grade · ⇧1/⇧7/⇧3 lado/topo/ponta · R início · ⌘Z desfaz · ` painel
    </div>
    <button class="lab-gear" title="painel (`)">⚙</button>
    <aside class="lab-panel"></aside>
  </body>
</html>
