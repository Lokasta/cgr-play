<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="data:," />
    <title>Cozy Gun Restoration</title>
    <style>
      :root {
        color-scheme: dark;
        --ui-ink: 23 17 13;
        --ui-cream: 242 228 197;
        --ui-gold: 217 184 108;
        --ui-muted: 176 155 119;
        --safe-left: max(18px, env(safe-area-inset-left));
        --safe-right: max(18px, env(safe-area-inset-right));
        --safe-top: max(18px, env(safe-area-inset-top));
        --safe-bottom: max(18px, env(safe-area-inset-bottom));
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #0d0a08;
        font-family: 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        background:
          radial-gradient(circle at 22% 22%, rgba(255, 204, 137, 0.025), transparent 34%),
          linear-gradient(180deg, rgba(8, 10, 10, 0.02), rgba(8, 6, 4, 0.08));
      }
      #app {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none; /* the game owns all gestures — no browser pan/zoom */
      }

      /* ---- HUD: tools + progress (locked in pitch: "HUD: tools + progresso") ---- */
      .hud-toolbar {
        position: fixed;
        left: var(--safe-left);
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 9px;
        z-index: 10;
      }
      .hud-tool {
        position: relative;
        width: 58px;
        height: 58px;
        border-radius: 14px;
        border: 1px solid rgba(var(--ui-cream), 0.15);
        background:
          linear-gradient(145deg, rgba(48, 37, 27, 0.92), rgba(var(--ui-ink), 0.97));
        -webkit-backdrop-filter: blur(10px) saturate(0.8);
        backdrop-filter: blur(10px) saturate(0.8);
        box-shadow:
          0 10px 28px rgba(5, 3, 2, 0.24),
          inset 0 1px rgba(255, 240, 205, 0.05);
        color: rgb(var(--ui-muted));
        font-size: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          border-color 0.16s ease,
          background 0.16s ease,
          color 0.16s ease,
          transform 0.16s cubic-bezier(0.2, 0.8, 0.2, 1),
          box-shadow 0.16s ease;
      }
      .hud-tool::after {
        content: '';
        position: absolute;
        left: -1px;
        top: 15px;
        bottom: 15px;
        width: 2px;
        border-radius: 3px;
        background: rgb(var(--ui-gold));
        box-shadow: 0 0 12px rgba(var(--ui-gold), 0.65);
        opacity: 0;
        transform: scaleY(0.25);
        transition: opacity 0.16s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .hud-tool:hover,
      .hud-tool:focus-visible {
        border-color: rgba(var(--ui-cream), 0.42);
        color: rgb(var(--ui-cream));
        transform: translateX(2px) scale(1.035);
        outline: none;
      }
      .hud-tool svg {
        width: 27px;
        height: 27px;
        display: block;
        color: rgba(var(--ui-cream), 0.9);
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.68));
        transition: color 0.16s ease, filter 0.16s ease;
      }
      .hud-tool:hover svg,
      .hud-tool:focus-visible svg,
      .hud-tool.active svg {
        color: rgb(var(--ui-cream));
        filter:
          drop-shadow(0 1px 2px rgba(0, 0, 0, 0.7))
          drop-shadow(0 0 5px rgba(var(--ui-gold), 0.18));
      }
      .hud-tool.active {
        border-color: rgba(var(--ui-gold), 0.82);
        background: linear-gradient(145deg, rgba(91, 68, 39, 0.94), rgba(37, 27, 19, 0.94));
        color: rgb(var(--ui-cream));
        box-shadow:
          0 10px 30px rgba(5, 3, 2, 0.32),
          0 0 20px rgba(var(--ui-gold), 0.16),
          inset 0 1px rgba(255, 237, 193, 0.1);
      }
      .hud-tool.active::after {
        opacity: 1;
        transform: scaleY(1);
      }
      .hud-tool span.label {
        position: absolute;
        left: 68px;
        padding: 6px 9px;
        border: 1px solid rgba(var(--ui-cream), 0.12);
        border-radius: 7px;
        background: rgba(var(--ui-ink), 0.86);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(var(--ui-cream), 0.9);
        opacity: 0;
        transform: translateX(-4px);
        transition: opacity 0.15s ease, transform 0.18s ease;
        pointer-events: none;
        white-space: nowrap;
      }
      .hud-tool:hover span.label,
      .hud-tool:focus-visible span.label,
      .hud-tool.active span.label {
        opacity: 1;
        transform: translateX(0);
      }
      .hud-tool.working {
        animation: tool-work 0.16s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .hud-tool.blocked {
        animation: tool-blocked 0.22s ease-out;
      }

      .hud-progress {
        position: fixed;
        top: var(--safe-top);
        right: var(--safe-right);
        display: flex;
        flex-direction: column;
        gap: 7px;
        width: min(238px, calc(100vw - 36px));
        padding: 11px 15px 13px;
        border-radius: 15px;
        border: 1px solid rgba(var(--ui-cream), 0.14);
        background: linear-gradient(145deg, rgba(48, 36, 25, 0.78), rgba(var(--ui-ink), 0.88));
        -webkit-backdrop-filter: blur(10px) saturate(0.8);
        backdrop-filter: blur(10px) saturate(0.8);
        box-shadow:
          0 12px 30px rgba(4, 3, 2, 0.24),
          inset 0 1px rgba(255, 240, 205, 0.05);
        z-index: 10;
        transform-origin: top right;
      }
      .hud-progress .copy {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
      }
      .hud-progress .eyebrow {
        color: rgba(var(--ui-muted), 0.78);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.18em;
      }
      .hud-progress .pct {
        color: rgb(var(--ui-cream));
        font-size: 16px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        min-width: 42px;
        text-align: right;
      }
      .hud-progress .track {
        width: 100%;
        height: 5px;
        border-radius: 999px;
        background: rgba(var(--ui-cream), 0.1);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.34);
        overflow: hidden;
      }
      .hud-progress .fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #8f6d35, rgb(var(--ui-gold)) 72%, #f4d795);
        box-shadow: 0 0 10px rgba(var(--ui-gold), 0.28);
        transition: width 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .hud-progress.bump {
        animation: progress-bump 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .hud-progress.settled {
        animation: progress-settled 0.58s ease-out;
      }
      .hud-progress.complete {
        border-color: rgba(var(--ui-gold), 0.72);
        animation: progress-complete 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .hud-toolbar.dimmed .hud-tool {
        opacity: 0.28;
        pointer-events: none;
        filter: grayscale(0.7);
      }
      .hud-toolbar.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .hud-progress.dimmed {
        opacity: 0;
        pointer-events: none;
      }
      .hud-toolbar,
      .hud-progress {
        transition: opacity 0.5s ease;
      }

      .hud-caption {
        position: fixed;
        bottom: max(7%, calc(var(--safe-bottom) + 20px));
        left: 50%;
        transform: translateX(-50%);
        max-width: min(680px, calc(100vw - 44px));
        padding: 9px 17px 10px;
        border: 1px solid rgba(var(--ui-cream), 0.08);
        border-radius: 9px;
        background: rgba(var(--ui-ink), 0.68);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
        color: rgba(var(--ui-cream), 0.96);
        font-size: clamp(14px, 1.35vw, 17px);
        font-style: italic;
        letter-spacing: 0.01em;
        text-align: center;
        opacity: 0;
        transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
        pointer-events: none;
        z-index: 10;
      }
      .hud-caption.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(-3px);
      }

      .hud-tool .key {
        position: absolute;
        top: 5px;
        right: 7px;
        font-size: 8px;
        font-weight: 700;
        color: rgba(var(--ui-muted), 0.66);
        pointer-events: none;
      }
      .hud-tool .mode {
        position: absolute;
        left: 50%;
        bottom: 5px;
        transform: translateX(-50%);
        color: rgba(var(--ui-muted), 0.76);
        font-size: 6px;
        font-weight: 800;
        letter-spacing: 0.08em;
        pointer-events: none;
      }
      .hud-tool[data-tool='lamp'][data-mode='grease'].active { color: #76edff; }
      .hud-tool[data-tool='lamp'][data-mode='grime'].active { color: #ff78bf; }
      .hud-tool[data-tool='lamp'][data-mode='dry'].active { color: #caff70; }
      .hud-tool .brush-condition {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 5px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(var(--ui-cream), 0.1);
        box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.4);
        pointer-events: none;
      }
      .hud-tool .brush-condition i {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #cbb986, #9c653c 72%, #672e20);
        transform: scaleX(var(--brush-soil, 0));
        transform-origin: left;
        transition: transform 0.14s linear, filter 0.18s ease;
      }
      .hud-tool[data-condition='saturated'] .brush-condition i {
        filter: brightness(1.55) saturate(1.45);
        box-shadow: 0 0 7px #b75d36;
      }
      .hud-tool.contaminating { animation: tool-contaminating 0.28s ease-out; }
      .hud-tool.care-working .brush-condition i {
        filter: brightness(1.8) saturate(0.7);
      }

      .brush-ring {
        position: fixed;
        top: 0;
        left: 0;
        border: 2px solid rgba(255, 246, 224, 0.98);
        border-radius: 50%;
        box-shadow:
          0 0 0 1.5px rgba(12, 8, 5, 0.92),
          0 0 0 3.5px rgba(255, 240, 205, 0.24),
          inset 0 0 0 1px rgba(12, 8, 5, 0.46),
          0 2px 8px rgba(0, 0, 0, 0.72);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s ease;
        z-index: 20;
        mix-blend-mode: normal;
      }
      .brush-ring::before {
        content: '';
        position: absolute;
        inset: -5px;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
      }
      .brush-ring[data-tool='cloth'] {
        border-style: dashed;
      }
      .brush-ring[data-tool='brush']::before {
        opacity: 0.92;
        background: repeating-conic-gradient(
          from -4deg,
          rgba(255, 240, 205, 0.95) 0deg 3deg,
          transparent 3deg 20deg
        );
        -webkit-mask: radial-gradient(circle, transparent calc(50% - 2px), #000 calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 2px));
        mask: radial-gradient(circle, transparent calc(50% - 2px), #000 calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 2px));
      }
      .brush-ring[data-tool='lamp'] {
        border-style: solid;
        border-width: 2px;
        box-shadow:
          0 0 0 1.5px rgba(8, 10, 12, 0.9),
          0 0 14px currentColor,
          inset 0 0 18px color-mix(in srgb, currentColor 26%, transparent);
      }
      .brush-ring[data-tool='lamp']::before {
        inset: 3px;
        opacity: 0.34;
        mix-blend-mode: screen;
        -webkit-mask: radial-gradient(circle, #000 0 72%, transparent 96%);
        mask: radial-gradient(circle, #000 0 72%, transparent 96%);
      }
      .brush-ring[data-tool='lamp'][data-mode='grease']::before {
        background: repeating-linear-gradient(
          0deg,
          rgba(39, 225, 255, 0.26) 0 2px,
          transparent 2px 10px
        );
      }
      .brush-ring[data-tool='lamp'][data-mode='grime']::before {
        background-image: radial-gradient(circle, rgba(255, 61, 174, 0.5) 0 1.5px, transparent 2.4px);
        background-size: 13px 13px;
      }
      .brush-ring[data-tool='lamp'][data-mode='dry']::before {
        background: repeating-linear-gradient(
          135deg,
          rgba(182, 255, 56, 0.3) 0 2px,
          transparent 2px 11px
        );
      }
      .brush-ring[data-tool='lamp'][data-mode='grease'] { color: #27e1ff; border-color: #27e1ff; background: transparent; }
      .brush-ring[data-tool='lamp'][data-mode='grime'] { color: #ff3dae; border-color: #ff3dae; background: transparent; }
      .brush-ring[data-tool='lamp'][data-mode='dry'] { color: #b6ff38; border-color: #b6ff38; background: transparent; }
      .brush-dot[data-tool='lamp'][data-mode='grease'] { color: #27e1ff; border-color: #27e1ff; background: #27e1ff; }
      .brush-dot[data-tool='lamp'][data-mode='grime'] { color: #ff3dae; border-color: #ff3dae; background: #ff3dae; }
      .brush-dot[data-tool='lamp'][data-mode='dry'] { color: #b6ff38; border-color: #b6ff38; background: #b6ff38; }
      .brush-dot {
        position: fixed;
        top: 0;
        left: 0;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(255, 246, 224, 0.98);
        box-shadow:
          0 0 0 1.5px rgba(12, 8, 5, 0.9),
          0 0 8px rgba(var(--ui-gold), 0.62);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s ease;
        z-index: 20;
      }
      .brush-dot[data-tool='oil'] {
        border-radius: 60% 50% 65% 50%;
        rotate: 45deg;
      }
      .brush-ring.tool-cloth { border-color: rgba(235, 219, 186, 0.92); }
      .brush-ring.tool-brush { border-color: rgba(202, 169, 111, 0.94); }
      .brush-ring.tool-oil { border-color: rgba(149, 190, 204, 0.95); }
      .brush-ring.is-biting { animation: brush-bite 0.15s ease-out; }
      .brush-ring.is-blocked { animation: brush-blocked 0.24s ease-out; border-color: rgba(206, 126, 82, 0.95); }
      .brush-ring.is-settled { animation: brush-settled 0.55s ease-out; }
      .brush-ring.is-contaminating {
        animation: brush-contaminating 0.27s ease-out;
        border-color: #bd623a;
        box-shadow: 0 0 0 1.5px rgba(23, 10, 6, 0.95), 0 0 15px rgba(189, 98, 58, 0.75);
      }
      .brush-fleck {
        position: fixed;
        left: 0;
        top: 0;
        width: 4px;
        height: 2px;
        border-radius: 999px;
        background: #c9ad7c;
        pointer-events: none;
        z-index: 19;
        transform: translate(var(--x), var(--y));
        animation: fleck-out 0.34s ease-out forwards;
      }
      .brush-fleck.tool-cloth { background: #c7b596; }
      .brush-fleck.tool-brush { background: #8c7048; }
      .brush-fleck.tool-oil { width: 3px; height: 3px; background: #a9d4dc; box-shadow: 0 0 5px rgba(141, 205, 217, 0.55); }

      @keyframes tool-work {
        0% { transform: translateX(2px) scale(1.04); }
        50% { transform: translateX(3px) scale(0.96); }
        100% { transform: translateX(2px) scale(1); }
      }
      @keyframes tool-blocked {
        0%, 100% { transform: translateX(2px); }
        35% { transform: translateX(-2px); }
        70% { transform: translateX(5px); }
      }
      @keyframes tool-contaminating {
        0%, 100% { transform: translateX(2px) rotate(0); }
        35% { transform: translateX(0) rotate(-2deg); }
        70% { transform: translateX(4px) rotate(2deg); }
      }
      @keyframes progress-bump {
        0% { transform: scale(1); }
        45% { transform: scale(1.025); }
        100% { transform: scale(1); }
      }
      @keyframes progress-settled {
        0% { box-shadow: 0 12px 30px rgba(4, 3, 2, 0.24); }
        35% { box-shadow: 0 12px 30px rgba(4, 3, 2, 0.24), 0 0 30px rgba(var(--ui-gold), 0.38); }
        100% { box-shadow: 0 12px 30px rgba(4, 3, 2, 0.24); }
      }
      @keyframes progress-complete {
        0% { transform: scale(1); }
        28% { transform: scale(1.06); box-shadow: 0 0 42px rgba(var(--ui-gold), 0.42); }
        100% { transform: scale(1); }
      }
      @keyframes brush-bite {
        0% { scale: 1; }
        45% { scale: 0.86; }
        100% { scale: 1; }
      }
      @keyframes brush-blocked {
        0%, 100% { translate: 0 0; }
        35% { translate: -3px 0; }
        70% { translate: 3px 0; }
      }
      @keyframes brush-settled {
        0% { scale: 1; opacity: 1; }
        55% { scale: 1.6; opacity: 1; box-shadow: 0 0 22px rgba(var(--ui-gold), 0.6); }
        100% { scale: 1; opacity: 1; }
      }
      @keyframes brush-contaminating {
        0% { scale: 1; }
        45% { scale: 1.16; }
        100% { scale: 1; }
      }
      @keyframes fleck-out {
        from { opacity: 0.9; transform: translate(var(--x), var(--y)) rotate(var(--rot)); }
        to { opacity: 0; transform: translate(calc(var(--x) + var(--dx)), calc(var(--y) + var(--dy))) rotate(calc(var(--rot) + 55deg)); }
      }

      @media (max-width: 640px), (orientation: portrait) {
        .hud-toolbar {
          left: 50%;
          top: auto;
          bottom: var(--safe-bottom);
          transform: translateX(-50%);
          flex-direction: row;
          gap: 8px;
        }
        .hud-tool {
          width: 54px;
          height: 54px;
        }
        .hud-tool::after {
          left: 15px;
          right: 15px;
          top: auto;
          bottom: -1px;
          width: auto;
          height: 2px;
          transform: scaleX(0.25);
        }
        .hud-tool.active::after { transform: scaleX(1); }
        .hud-tool:hover,
        .hud-tool:focus-visible { transform: translateY(-2px) scale(1.025); }
        .hud-tool span.label {
          left: 50%;
          bottom: 64px;
          transform: translate(-50%, 4px);
        }
        .hud-tool:hover span.label,
        .hud-tool:focus-visible span.label,
        .hud-tool.active span.label { transform: translate(-50%, 0); }
        .hud-progress {
          left: 50%;
          right: auto;
          width: min(220px, calc(100vw - 36px));
          transform: translateX(-50%);
          transform-origin: top center;
        }
        .hud-progress.bump { animation-name: progress-bump-mobile; }
        .hud-progress.complete { animation-name: progress-complete-mobile; }
        .hud-caption {
          top: calc(var(--safe-top) + 126px);
          bottom: auto;
          max-width: calc(100vw - 30px);
        }
      }
      @media (hover: none) {
        .hud-tool:not(.active) span.label {
          opacity: 0;
          transform: translate(-50%, 4px);
        }
      }
      @keyframes progress-bump-mobile {
        0% { transform: translateX(-50%) scale(1); }
        45% { transform: translateX(-50%) scale(1.025); }
        100% { transform: translateX(-50%) scale(1); }
      }
      @keyframes progress-complete-mobile {
        0% { transform: translateX(-50%) scale(1); }
        28% { transform: translateX(-50%) scale(1.06); box-shadow: 0 0 42px rgba(var(--ui-gold), 0.42); }
        100% { transform: translateX(-50%) scale(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }

      /* ---- tuning panel (designer's knobs) ---- */
      .tune-gear {
        position: fixed;
        right: 14px;
        bottom: 14px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid rgba(214, 186, 140, 0.2);
        background: rgba(24, 18, 13, 0.6);
        color: rgba(214, 186, 140, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 30;
      }
      .tune-gear svg { width: 20px; height: 20px; }
      .tune-gear:hover { color: #e8d5ac; }
      .tune-panel {
        position: fixed;
        top: 12px;
        right: 12px;
        bottom: 64px;
        width: min(320px, calc(100vw - 24px));
        overflow-y: auto;
        padding: 12px;
        border-radius: 14px;
        border: 1px solid rgba(214, 186, 140, 0.2);
        background: rgba(18, 13, 9, 0.92);
        backdrop-filter: blur(8px);
        color: #d8c49a;
        font-size: 12px;
        z-index: 31;
        display: none;
      }
      .tune-panel.open { display: block; }
      .tune-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 14px; }
      .tune-tabs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 4px;
        padding: 3px;
        border: 1px solid rgba(214, 186, 140, 0.16);
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.22);
      }
      .tune-tab {
        border: 0;
